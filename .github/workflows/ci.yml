name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The app is built with the newest Xcode (its SDK's delegate signatures differ from Xcode 16's).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: ZmashKit unit tests
        run: cd Packages/ZmashKit && swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Simulator build
        run: |
          xcodegen generate
          xcodebuild -project Zmash.xcodeproj -scheme Zmash \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: App unit tests
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -project Zmash.xcodeproj -scheme Zmash \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet
