<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Flat cards, hairline borders; shadow only on sheets" name="Surfaces & borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px 24px;background:var(--bg);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;box-sizing:border-box;min-height:150px}
.l{font:500 11px var(--font-mono);letter-spacing:.08em;color:var(--fg-3)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:500 10.5px var(--font-mono);gap:1px}
.n{font-family:var(--font-sans);font-stretch:62%;font-weight:800;line-height:.82}
</style></head><body><div class="row" style="gap:16px;height:100px">
<div style="flex:1;border-radius:16px;background:var(--surface);border:1px solid var(--border);padding:12px"><span class="l">card · 1px border</span></div>
<div style="flex:1;border-radius:16px;background:var(--surface-sunk);padding:12px"><span class="l">sunk · no border</span></div>
<div style="flex:1;border-radius:16px;background:var(--tex-hatch);padding:12px"><span class="l" style="color:#A8A396">hero · hatch</span></div>
<div style="flex:1;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sheet);padding:12px"><span class="l">sheet · shadow</span></div></div></body></html>
