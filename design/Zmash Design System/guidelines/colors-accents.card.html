<!-- @dsCard group="Colors" viewport="700x150" subtitle="Vermilion = effort · Team blue = terrain" name="Accents" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px 24px;background:var(--bg);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;box-sizing:border-box;min-height:150px}
.l{font:500 11px var(--font-mono);letter-spacing:.08em;color:var(--fg-3)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:500 10.5px var(--font-mono);gap:1px}
.n{font-family:var(--font-sans);font-stretch:62%;font-weight:800;line-height:.82}
</style></head><body><div class="row" style="height:110px">
<div class="sw" style="flex:2;height:auto;background:var(--vermilion);color:var(--ink)"><span style="font:700 15px var(--font-sans)">Vermilion</span><span>oklch(.64 .19 34) · effort, primary action, progress</span></div>
<div class="sw" style="height:auto;background:var(--vermilion-deep);color:var(--bone-100)"><span>deep</span><span>.54 .19 30</span></div>
<div class="sw" style="flex:2;height:auto;background:var(--team-blue);color:var(--bone-100)"><span style="font:700 15px var(--font-sans)">Team blue</span><span>oklch(.64 .19 250) · terrain, elevation, aerobic</span></div>
<div class="sw" style="height:auto;background:var(--team-blue-wash);color:var(--ink);border:1px solid var(--border)"><span>wash</span><span>16% alpha</span></div></div></body></html>
