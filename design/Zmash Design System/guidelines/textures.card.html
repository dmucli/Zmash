<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px 24px;background:var(--bg);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;box-sizing:border-box;min-height:150px}
.l{font:500 11px var(--font-mono);letter-spacing:.08em;color:var(--fg-3)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:500 10.5px var(--font-mono);gap:1px}
.n{font-family:var(--font-sans);font-stretch:62%;font-weight:800;line-height:.82}
</style></head><body><div class="row" style="height:108px">
<div style="flex:1;border-radius:10px;background:var(--bone-100);position:relative;overflow:hidden;border:1px solid var(--border)"><div style="position:absolute;inset:0;background-image:var(--tex-grain-light);mix-blend-mode:multiply"></div><span class="l" style="position:absolute;left:10px;bottom:8px">grain · every bg</span></div>
<div style="flex:1;border-radius:10px;background:repeating-linear-gradient(135deg,#1F1D1A 0 10px,#191815 10px 20px);position:relative"><span class="l" style="position:absolute;left:10px;bottom:8px;color:#A8A396">hatch · hero, media</span></div>
<div style="flex:1;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:var(--ink)"><div style="height:4px;background:var(--tex-lane)"></div><span class="l">lane · distance</span></div>
<div style="flex:1;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:10px"><div style="height:5px;background:var(--tex-stripe)"></div><span class="l">tri-stripe 6:1:2</span></div></div></body></html>
