<!-- @dsCard group="Colors" viewport="700x110" subtitle="Connection + alerts, always paired with a label" name="Status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px 24px;background:var(--bg);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;box-sizing:border-box;min-height:110px}
.l{font:500 11px var(--font-mono);letter-spacing:.08em;color:var(--fg-3)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:500 10.5px var(--font-mono);gap:1px}
.n{font-family:var(--font-sans);font-stretch:62%;font-weight:800;line-height:.82}
</style></head><body><div class="row"><div style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:14px"><span style="width:8px;height:8px;border-radius:50%;background:var(--go)"></span>Connected<span class="l" style="margin-left:auto">--go</span></div><div style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:14px"><span style="width:8px;height:8px;border-radius:50%;background:var(--caution)"></span>Connecting<span class="l" style="margin-left:auto">--caution</span></div><div style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:14px"><span style="width:8px;height:8px;border-radius:50%;background:var(--stop)"></span>Dropped<span class="l" style="margin-left:auto">--stop</span></div></div></body></html>
