<!-- @dsCard group="Spacing" viewport="700x110" subtitle="Quick ease-out; nothing bounces" name="Motion" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px 24px;background:var(--bg);color:var(--fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;box-sizing:border-box;min-height:110px}
.l{font:500 11px var(--font-mono);letter-spacing:.08em;color:var(--fg-3)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:500 10.5px var(--font-mono);gap:1px}
.n{font-family:var(--font-sans);font-stretch:62%;font-weight:800;line-height:.82}
</style></head><body><div class="row"><div style="flex:1;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px"><span class="n" style="font-size:28px">140ms</span><span class="l">--dur-fast · press, toggle</span></div><div style="flex:1;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px"><span class="n" style="font-size:28px">220ms</span><span class="l">--dur-base · screen, sheet</span></div><div style="flex:1;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px"><span class="n" style="font-size:28px">420ms</span><span class="l">--dur-slow · metric count-up</span></div></div><div class="l" style="margin-top:10px">--ease-out: cubic-bezier(.2,.7,.2,1) · press = scale(.97)</div></body></html>
