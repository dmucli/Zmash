name: Zmash
options:
  bundleIdPrefix: com.davidmucelli
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here (or in Xcode › Signing & Capabilities) to run on the iPad.
    DEVELOPMENT_TEAM: 8SWF86SUL4
    CODE_SIGN_STYLE: Automatic
packages:
  ZmashKit:
    path: Packages/ZmashKit
targets:
  Zmash:
    type: application
    platform: iOS
    sources:
      - path: Zmash
    dependencies:
      - package: ZmashKit
      - target: ZmashWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidmucelli.zmash
        CODE_SIGN_ENTITLEMENTS: Zmash/Zmash.entitlements
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zmash
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Zmash connects to your trainer and Zwift Ride controllers.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Zmash saves your rides to Apple Health as indoor cycling workouts.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Zmash reads nothing from Apple Health; this is required to save workouts.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    info:
      path: Zmash/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central, audio]
        UIAppFonts: [Archivo.ttf, Newsreader.ttf, Outfit.ttf, RobotoFlex.ttf, BarlowCondensed-Regular.ttf, BarlowCondensed-Medium.ttf, BarlowCondensed-SemiBold.ttf, BarlowCondensed-Bold.ttf, BarlowCondensed-ExtraBold.ttf, BarlowCondensed-BoldItalic.ttf, PermanentMarker-Regular.ttf]
        # Strava's OAuth callback (Phase 9 uploads).
        CFBundleURLTypes:
          - CFBundleURLName: com.davidmucelli.zmash.oauth
            CFBundleURLSchemes: [zmash]
  # The ride's Live Activity on iPhone (D103).
  ZmashWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ZmashWidgets
      - path: Zmash/Shared/RideActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidmucelli.zmash.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zmash
        SKIP_INSTALL: YES
    info:
      path: ZmashWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Zmash:
    build:
      targets:
        Zmash: all
    test:
      gatherCoverageData: false
